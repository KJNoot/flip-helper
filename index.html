<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Take a photo, get a listing draft, and keep track of what you sell on more than one site.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flip Side">
<meta name="format-detection" content="telephone=no">
<title>Jessika's Flip Side</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="apphead">
  <a class="apphead-brand" href="#/home" aria-label="Jessika's Flip Side">
    <svg class="wordmark-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <rect width="32" height="32" rx="9" fill="#0f766e"/>
      <path d="M9 15.2c.7-3.5 3.6-6 7.2-6 2.6 0 4.9 1.3 6.3 3.3" fill="none" stroke="#fff" stroke-width="2.15" stroke-linecap="round"/>
      <path d="M24.4 8.4l.1 5.3-4.8-1.7z" fill="#fff"/>
      <path d="M23 16.8c-.7 3.5-3.6 6-7.2 6-2.6 0-4.9-1.3-6.3-3.3" fill="none" stroke="#5eead4" stroke-width="2.15" stroke-linecap="round"/>
      <path d="M7.6 23.6l-.1-5.3 4.8 1.7z" fill="#5eead4"/>
    </svg>
    <span class="wordmark">
      <span class="wordmark-script">Jessika’s</span>
      <span class="wordmark-bold">Flip Side</span>
    </span>
  </a>
  <button type="button" class="suggest-btn" id="suggest-open">Send a suggestion</button>
</header>
<main id="view" aria-live="polite"><div class="empty"><span class="em">📷</span>Loading…</div></main>
<nav class="tabs" aria-label="Main">
  <a href="#/home" data-tab="home"><span class="ti" aria-hidden="true">🏠</span>Home</a>
  <a href="#/items" data-tab="items"><span class="ti" aria-hidden="true">📦</span>Items<span class="tab-badge" id="items-badge" hidden></span></a>
  <a href="#/scan" data-tab="scan"><span class="ti" aria-hidden="true">🔎</span>Scan</a>
  <a href="#/add" data-tab="add"><span class="ti" aria-hidden="true">📷</span>Add</a>
  <a href="#/settings" data-tab="settings"><span class="ti" aria-hidden="true">⚙️</span>Settings</a>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript>Jessika's Flip Side needs JavaScript turned on.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
